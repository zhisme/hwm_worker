name: Feature request
description: Suggest a new behaviour or improvement
title: "[Feature]: "
labels: [enhancement]
assignees: [zhisme]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to do today?
      placeholder: |
        The worker takes the first job it finds, I want it to pick the one with the highest salary.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - work (job application flow)
        - auto-hunt
        - inventory check
        - captcha solving (rucaptcha)
        - login / session handling
        - scheduling and sleep times
        - docker / kubernetes / deployment
        - logging and error reporting
        - other
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen instead? Include config keys or env vars you'd expect.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
          required: false
