name: Build and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and deploy (e.g. v1.3.0)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/zhisme/hwm_worker

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      git_tag: ${{ steps.version.outputs.git_tag }}
    steps:
      - name: Resolve git tag
        id: version
        run: |
          GIT_TAG="${{ github.event.inputs.tag || github.ref_name }}"

          if [[ ! "$GIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "tag $GIT_TAG is not a vX.Y.Z version tag"
            exit 1
          fi

          echo "git_tag=$GIT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${GIT_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.git_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.git_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.git_tag }}
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image tag
        run: |
          echo "Built and pushed image: ${{ steps.meta.outputs.tags }}"
          echo "Deploying version: ${{ steps.version.outputs.version }}"

  update-infra:
    name: Update Infrastructure Repository
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v7
        with:
          repository: zhisme/zhisme-infra
          token: ${{ secrets.INFRA_REPO_PAT }}
          ref: master

      - name: Setup yq
        uses: mikefarah/yq@v4

      - name: Update values.yaml and Chart.yaml with new version
        run: |
          VERSION="${{ needs.build-and-push.outputs.version }}"
          echo "Updating hwm-worker to version: $VERSION"

          yq eval ".image.tag = \"$VERSION\"" -i helm/charts/hwm-worker/values.yaml
          yq eval ".appVersion = \"$VERSION\"" -i helm/charts/hwm-worker/Chart.yaml

          echo "Updated values.yaml:"
          grep -A 3 "image:" helm/charts/hwm-worker/values.yaml
          echo "Updated Chart.yaml:"
          grep "appVersion" helm/charts/hwm-worker/Chart.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add helm/charts/hwm-worker/values.yaml helm/charts/hwm-worker/Chart.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update hwm-worker to ${{ needs.build-and-push.outputs.git_tag }}

          Triggered by: ${{ github.repository }}@${{ needs.build-and-push.outputs.git_tag }}
          Author: ${{ github.actor }}"

          git push origin master

          echo "Successfully updated zhisme-infra repository"
